<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WRC 2026 — Datadump</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #141414;
      --border: #242424;
      --text: #f0f0f0;
      --muted: #8a8a8a;
      --dim: #555;
      --accent: #ff8a3d;
      --accent-soft: rgba(255, 138, 61, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 16px;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 20px 14px 120px; }

    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .head h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
    .head .eyebrow {
      font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--accent);
      letter-spacing: 0.15em; text-transform: uppercase; display: block; margin-bottom: 2px;
    }
    .head a { color: var(--muted); text-decoration: none; font-size: 0.85rem; white-space: nowrap; }
    .head a:hover { color: var(--accent); }

    /* Composer */
    .composer {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
      position: sticky;
      top: 8px;
      z-index: 5;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
    .composer .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .composer input, .composer textarea {
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: 16px; font-family: inherit;
      width: 100%;
    }
    .composer input:focus, .composer textarea:focus { outline: none; border-color: var(--accent); }
    .composer textarea { min-height: 64px; resize: vertical; }
    .composer .actions { display: flex; gap: 8px; align-items: center; }
    .composer button {
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: 8px; padding: 10px 14px; font-size: 15px; font-family: inherit;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    .composer button:active { background: var(--accent-soft); }
    .composer button.primary { background: var(--accent); border-color: var(--accent); color: #14100c; font-weight: 600; margin-left: auto; }
    .composer button.recording { background: #b3261e; border-color: #b3261e; color: #fff; }
    .composer button:disabled { opacity: 0.4; cursor: default; }
    .status { font-size: 0.8rem; color: var(--muted); margin-top: 8px; min-height: 1.1em; }
    .status.err { color: #ff6b6b; }

    /* Feed */
    .day-sep {
      font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--dim);
      letter-spacing: 0.16em; text-transform: uppercase;
      margin: 26px 0 12px; text-align: center;
    }
    .entry {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .entry .e-head {
      display: flex; align-items: baseline; gap: 8px;
      padding: 10px 14px 0;
    }
    .entry .e-author { font-weight: 600; font-size: 0.92rem; }
    .entry .e-ts { color: var(--dim); font-size: 0.78rem; font-family: 'JetBrains Mono', monospace; margin-left: auto; white-space: nowrap; }
    .entry .e-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 600;
      color: var(--accent); background: var(--accent-soft);
      border: 1px solid rgba(255,138,61,0.35); border-radius: 4px; padding: 0 6px;
      white-space: nowrap;
    }
    .entry .e-body { padding: 6px 14px 12px; color: #e0e0e0; font-size: 0.95rem; white-space: pre-wrap; word-wrap: break-word; }
    .entry .e-body:empty { display: none; padding: 0; }
    .entry img { width: 100%; display: block; margin-top: 8px; background: #000; }
    .entry audio { width: calc(100% - 28px); margin: 8px 14px 14px; display: block; }
    .empty { color: var(--muted); font-style: italic; text-align: center; padding: 40px 0; }

    .refresh-bar { text-align: center; margin: 8px 0 4px; }
    .refresh-bar button {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 6px 16px; font-size: 0.82rem; font-family: inherit; cursor: pointer;
    }
    .refresh-bar button:active { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <div class="head">
      <div>
        <span class="eyebrow">Live field notes · Jasper &amp; William</span>
        <h1 id="title">WRC 2026 — Datadump</h1>
      </div>
      <a href="wrc-2026.html">← Itinerary</a>
    </div>

    <div class="composer">
      <div class="row">
        <input type="text" id="author" placeholder="Your name" maxlength="80" style="max-width: 40%;">
        <input type="text" id="tag" placeholder="Booth / vendor (e.g. D306 AgileX)" maxlength="120">
      </div>
      <div class="row">
        <textarea id="body" placeholder="Note, or caption for photos/voice… (use your keyboard's mic to dictate)"></textarea>
      </div>
      <div class="actions">
        <button id="photoBtn" type="button" title="Add photos">📷 Photos</button>
        <button id="voiceBtn" type="button" title="Record voice note">🎤 Voice</button>
        <button id="sendBtn" type="button" class="primary">Send</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <div class="status" id="status"></div>
    </div>

    <div class="refresh-bar"><button id="refreshBtn" type="button">↻ Refresh feed</button></div>
    <div id="feed"><div class="empty">Loading…</div></div>
  </div>

  <script>
  (function () {
    "use strict";
    var ALBUM = new URLSearchParams(location.search).get("album") || "wrc-2026";
    var API = "/api/datadump";
    var NAME_KEY = "rfc-comment-author"; // shared with the comments widget

    var authorEl = document.getElementById("author");
    var tagEl = document.getElementById("tag");
    var bodyEl = document.getElementById("body");
    var statusEl = document.getElementById("status");
    var feedEl = document.getElementById("feed");
    var fileInput = document.getElementById("fileInput");
    var voiceBtn = document.getElementById("voiceBtn");

    authorEl.value = localStorage.getItem(NAME_KEY) || "";

    function setStatus(text, isErr) {
      statusEl.textContent = text || "";
      statusEl.className = "status" + (isErr ? " err" : "");
    }

    function author() {
      var a = authorEl.value.trim();
      if (a) localStorage.setItem(NAME_KEY, a);
      return a;
    }

    /* ── posting ── */

    function post(payload) {
      payload.album = ALBUM;
      payload.author = author();
      payload.tag = tagEl.value.trim();
      return fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
          return j;
        });
      });
    }

    function blobToB64(blob) {
      return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onload = function () { resolve(String(fr.result).split(",")[1]); };
        fr.onerror = reject;
        fr.readAsDataURL(blob);
      });
    }

    function loadImage(file) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () { resolve({ img: img, url: url }); };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("could not read image")); };
        img.src = url;
      });
    }

    function canvasBlob(canvas, q) {
      return new Promise(function (resolve) { canvas.toBlob(resolve, "image/jpeg", q); });
    }

    async function compressImage(file) {
      var loaded = await loadImage(file);
      var MAX_DIM = 1600, TARGET = 700000;
      var w = loaded.img.naturalWidth, h = loaded.img.naturalHeight;
      var scale = Math.min(1, MAX_DIM / Math.max(w, h));
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext("2d").drawImage(loaded.img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(loaded.url);
      var blob = null;
      for (var q = 0.8; q >= 0.4; q -= 0.1) {
        blob = await canvasBlob(canvas, q);
        if (blob && blob.size <= TARGET) break;
      }
      if (!blob) throw new Error("image encode failed");
      return blob;
    }

    async function sendImages(files) {
      var caption = bodyEl.value.trim();
      for (var i = 0; i < files.length; i++) {
        setStatus("Uploading photo " + (i + 1) + "/" + files.length + "…");
        var blob = await compressImage(files[i]);
        var b64 = await blobToB64(blob);
        await post({ kind: "image", mime: "image/jpeg", data: b64, body: caption });
      }
      bodyEl.value = "";
      setStatus(files.length + (files.length === 1 ? " photo" : " photos") + " sent ✓");
      loadFeed();
    }

    document.getElementById("photoBtn").addEventListener("click", function () { fileInput.click(); });
    fileInput.addEventListener("change", function () {
      var files = Array.prototype.slice.call(fileInput.files || []);
      fileInput.value = "";
      if (!files.length) return;
      sendImages(files).catch(function (e) { setStatus("Upload failed: " + e.message, true); });
    });

    /* ── voice ── */

    var rec = null, chunks = [], recStart = 0, recTimer = null;

    function pickAudioMime() {
      if (!window.MediaRecorder) return null;
      var mimes = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"];
      for (var i = 0; i < mimes.length; i++) if (MediaRecorder.isTypeSupported(mimes[i])) return mimes[i];
      return "";
    }

    voiceBtn.addEventListener("click", function () {
      if (rec && rec.state === "recording") { rec.stop(); return; }
      var mime = pickAudioMime();
      if (mime === null) { setStatus("Voice recording not supported in this browser.", true); return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        chunks = [];
        rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
        rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
          clearInterval(recTimer);
          voiceBtn.classList.remove("recording");
          voiceBtn.textContent = "🎤 Voice";
          var blob = new Blob(chunks, { type: rec.mimeType || mime || "audio/webm" });
          if (blob.size < 1000) { setStatus("Recording too short.", true); return; }
          if (blob.size > 1000000) { setStatus("Recording too long (>1 MB) — keep it under ~90 s.", true); return; }
          setStatus("Uploading voice note…");
          blobToB64(blob).then(function (b64) {
            return post({ kind: "audio", mime: blob.type, data: b64, body: bodyEl.value.trim() });
          }).then(function () {
            bodyEl.value = "";
            setStatus("Voice note sent ✓");
            loadFeed();
          }).catch(function (e) { setStatus("Upload failed: " + e.message, true); });
        };
        rec.start();
        recStart = Date.now();
        voiceBtn.classList.add("recording");
        recTimer = setInterval(function () {
          var s = Math.round((Date.now() - recStart) / 1000);
          voiceBtn.textContent = "■ Stop " + Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
          if (s >= 90) rec.stop();
        }, 500);
        voiceBtn.textContent = "■ Stop 0:00";
        setStatus("Recording — tap Stop when done.");
      }).catch(function (e) { setStatus("Mic access denied: " + e.message, true); });
    });

    /* ── text ── */

    document.getElementById("sendBtn").addEventListener("click", function () {
      var text = bodyEl.value.trim();
      if (!text) { setStatus("Write something first (or use 📷 / 🎤).", true); return; }
      setStatus("Sending…");
      post({ kind: "text", body: text }).then(function () {
        bodyEl.value = "";
        setStatus("Sent ✓");
        loadFeed();
      }).catch(function (e) { setStatus("Send failed: " + e.message, true); });
    });

    /* ── feed ── */

    function fmtTime(ms) {
      var d = new Date(ms);
      return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    }
    function fmtDay(ms) {
      return new Date(ms).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    function render(entries) {
      feedEl.textContent = "";
      if (!entries.length) {
        feedEl.appendChild(el("div", "empty", "Nothing dumped yet — send the first note."));
        return;
      }
      entries.sort(function (a, b) { return b.ts - a.ts; });
      var lastDay = "";
      entries.forEach(function (e) {
        var day = fmtDay(e.ts);
        if (day !== lastDay) { feedEl.appendChild(el("div", "day-sep", day)); lastDay = day; }
        var card = el("div", "entry");
        var head = el("div", "e-head");
        head.appendChild(el("span", "e-author", e.author || "Anonymous"));
        if (e.tag) head.appendChild(el("span", "e-tag", e.tag));
        head.appendChild(el("span", "e-ts", fmtTime(e.ts)));
        card.appendChild(head);
        card.appendChild(el("div", "e-body", e.body || ""));
        if (e.kind === "image") {
          var a = document.createElement("a");
          a.href = API + "?media=" + e.id;
          a.target = "_blank";
          var img = document.createElement("img");
          img.src = API + "?media=" + e.id;
          img.loading = "lazy";
          img.alt = e.body || "photo";
          a.appendChild(img);
          card.appendChild(a);
        } else if (e.kind === "audio") {
          var au = document.createElement("audio");
          au.controls = true;
          au.preload = "metadata";
          au.src = API + "?media=" + e.id;
          card.appendChild(au);
        }
        feedEl.appendChild(card);
      });
    }

    function loadFeed() {
      fetch(API + "?album=" + encodeURIComponent(ALBUM))
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.j.error || "failed to load");
          render(res.j.entries || []);
        })
        .catch(function (e) {
          feedEl.textContent = "";
          feedEl.appendChild(el("div", "empty", "Could not load feed: " + e.message));
        });
    }

    document.getElementById("refreshBtn").addEventListener("click", loadFeed);
    setInterval(loadFeed, 45000);
    loadFeed();
  })();
  </script>
</body>
</html>
